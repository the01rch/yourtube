<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>YT</title>
    <link rel="stylesheet" href="/style.css?v=10">
</head>
<body>
    <header class="top">
        <a href="/?refresh=1" class="logo-link">
            <img src="/ytb-logo.png" alt="YourTube" class="logo">
        </a>
        <form method="get" action="/" class="search-form">
            <input type="text" name="q" value="{{QUERY}}"
                   placeholder="Search...  /v videos · /s shorts · /p playlists">
        </form>
    </header>

    <main class="content">
        {{HEADING_BLOCK}}
        {{FILTERS}}
        <div class="grid">{{ROWS}}</div>
        {{PAGINATION}}
    </main>

    <!-- Hidden target for click-to-copy: the /copy/ response loads here,
         so the main page never navigates or scrolls. -->
    <iframe name="copyframe" style="display:none;width:0;height:0;border:0" title="copy"></iframe>
</body>
</html>
